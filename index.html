<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Whack!">
<title>Whack-a-Mole</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- MENU -->
  <section id="menu" class="screen active">
    <h1>Whack<span>-a-</span>Mole</h1>
    <p class="tag">Use your own photos as the moles!</p>

    <div class="card">
      <div class="row">
        <h2>Your moles <small id="photoCount">(0)</small></h2>
        <button id="clearPhotos" class="link" hidden>Clear all</button>
      </div>
      <div id="thumbs" class="thumbs"></div>
      <p id="noPhotos" class="hint">No photos yet — the classic mole will pop up instead.</p>
      <label class="btn secondary">
        📷 Add photos
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
      </label>
      <button id="contactsBtn" class="btn secondary">👥 Pick from contacts</button>
      <p class="hint small">Photos stay on this phone. Nothing is uploaded.</p>
    </div>

    <div class="card">
      <h2>Difficulty</h2>
      <div class="seg" id="difficulty">
        <button data-d="easy">Easy</button>
        <button data-d="normal" class="on">Normal</button>
        <button data-d="hard">Hard</button>
      </div>
    </div>

    <button id="playBtn" class="btn primary big">▶ Play</button>
    <p class="best">Best: <b id="bestMenu">0</b></p>
    <button id="soundBtn" class="link">🔊 Sound on</button>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="hud">
      <div><span class="lbl">Score</span><b id="score">0</b></div>
      <div class="combo" id="combo"></div>
      <div><span class="lbl">Time</span><b id="time">30</b></div>
    </div>
    <div class="timebar"><div id="timebarFill"></div></div>
    <div id="board" class="board"></div>
    <button id="quitBtn" class="link light">Quit</button>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen">
    <h1>Time's up!</h1>
    <div class="card center">
      <p class="lbl">Score</p>
      <p class="final" id="finalScore">0</p>
      <p id="newBest" class="newbest" hidden>🏆 New best!</p>
      <p class="stats" id="stats"></p>
    </div>
    <button id="againBtn" class="btn primary big">↻ Play again</button>
    <button id="shareBtn" class="btn secondary">📤 Share score</button>
    <button id="menuBtn" class="link">Back to menu</button>
  </section>

  <div id="countdown" class="countdown" hidden></div>
</main>
<script src="game.js"></script>
</body>
</html>
